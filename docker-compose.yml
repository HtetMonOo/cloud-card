services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: cloudcart_pass
      POSTGRES_DB: cloudcartdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cloudcartdb;Username=cloudcart;Password=cloudcart_pass"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:80"

volumes:
  db_data: